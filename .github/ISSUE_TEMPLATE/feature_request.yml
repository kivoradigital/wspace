name: Feature request
description: Suggest an idea or improvement for wspace.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem first: a clear
        problem makes it much easier to agree on the right solution. Opening
        a request does not mean it will be implemented; see
        [CONTRIBUTING.md](https://github.com/kivoradigital/wspace/blob/main/CONTRIBUTING.md#how-decisions-are-made).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like wspace to behave? Include example commands if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - "No"
        - Yes, once the approach is agreed in this issue
    validations:
      required: true
