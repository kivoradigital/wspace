name: Release

# Runs when a maintainer pushes a v* tag (the release-tags ruleset lets only
# organization admins create them). Run it by hand (workflow_dispatch) for a
# dry run: a snapshot build that publishes nothing and uploads dist/ as an
# artifact. See .github/MAINTAINING.md.
#
# It runs on Windows because the Chocolatey package needs the choco binary;
# Go cross-compiles every other platform, and .goreleaser.yaml forces 0755 on
# the binaries inside the archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: windows-latest
    permissions:
      contents: write     # create the GitHub release and upload assets
      id-token: write     # sign build provenance attestations
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...
      - name: Choose GoReleaser arguments
        id: args
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "value=release --snapshot --clean --skip=publish" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            # Prerelease (v1.2.0-rc.1): no Chocolatey; skip_upload: auto in
            # .goreleaser.yaml also skips Homebrew, Scoop and winget.
            echo "value=release --clean --skip=chocolatey" >> "$GITHUB_OUTPUT"
          else
            echo "value=release --clean" >> "$GITHUB_OUTPUT"
          fi
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: ${{ steps.args.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Classic personal access token with the public_repo scope: writes
          # the Homebrew tap, the Scoop bucket and the winget-pkgs fork, and
          # opens the pull request against microsoft/winget-pkgs.
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.nupkg
            dist/checksums.txt
            dist/homebrew/**
            dist/scoop/**
            dist/winget/**
          retention-days: 3
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.nupkg
            dist/checksums.txt
