name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "::error::Commit $sha has no 'Signed-off-by: $author' trailer."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off every commit with 'git commit -s' (see CONTRIBUTING.md)."
            echo "To fix existing commits: git rebase --signoff $BASE_SHA && git push --force-with-lease"
            exit 1
          fi
          echo "Every commit is signed off."
