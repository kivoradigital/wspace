<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Application icon: the tray glyph on a rounded tile. The tray icon
       itself stays flat and single-colour because a menu bar recolours it;
       this one is the launcher and installer artwork, where colour is kept.
       A solid fill rather than a gradient, so every renderer in the
       packaging chain produces the same tile. -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#2F58D6"/>
  <g fill="#FFFFFF" transform="translate(512 512) scale(30.5) translate(-11.9 -12)">
    <rect x="4.70" y="5.20" width="2.20" height="13.60" rx="1.10"/>
    <rect x="4.70" y="9.50" width="13.30" height="2.20" rx="1.10"/>
    <rect x="4.70" y="17.70" width="13.30" height="2.20" rx="1.10"/>
    <circle cx="5.80" cy="5.20" r="2.60"/>
    <circle cx="18.00" cy="10.60" r="2.60"/>
    <circle cx="18.00" cy="18.80" r="2.60"/>
  </g>
</svg>
