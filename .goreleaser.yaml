# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# GoReleaser v2 configuration for the wspace CLI.
#
# Releases run from .github/workflows/release.yml when a v* tag is pushed.
# The Homebrew tap, Scoop bucket and winget fork are written with
# RELEASE_TOKEN (a classic personal access token with the public_repo scope);
# GITHUB_TOKEN cannot write to other repositories. skip_upload: auto skips
# them for prerelease tags such as v1.0.0-rc.1. Chocolatey is pushed with
# CHOCOLATEY_API_KEY and needs the choco binary, so releases run on Windows.
# Dry run locally (no choco) with
# `goreleaser release --snapshot --clean --skip=publish,chocolatey`.
version: 2

project_name: wspace

before:
  hooks:
    - go mod tidy

builds:
  - id: wspace
    main: ./cmd/wspace
    binary: wspace
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Same -X values as the Makefile's LDFLAGS (REPO_OWNER/REPO_NAME are the
    # update-check coordinates).
    ldflags:
      - -s -w
      - -X github.com/kivoradigital/wspace/internal/buildinfo.Version={{ .Version }}
      - -X github.com/kivoradigital/wspace/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/kivoradigital/wspace/internal/buildinfo.Date={{ .Date }}
      - -X github.com/kivoradigital/wspace/internal/buildinfo.RepoOwner=kivoradigital
      - -X github.com/kivoradigital/wspace/internal/buildinfo.RepoName=wspace

archives:
  - id: wspace
    ids:
      - wspace
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # "macos" instead of Go's "darwin" so people find the Mac downloads.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    # Releases are built on Windows, whose files carry no executable bit;
    # builds_info forces 0755 on the binaries inside every archive.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

nfpms:
  - id: wspace
    package_name: wspace
    ids:
      - wspace
    formats:
      - deb
      - rpm
    vendor: Kivora Digital S.L.
    maintainer: Kivora Digital S.L.
    homepage: https://github.com/kivoradigital/wspace
    description: Multi-repository git worktree workspaces (CLI, MCP server and RPC engine).
    license: Apache-2.0
    bindir: /usr/bin
    dependencies:
      - git
    contents:
      - src: LICENSE
        dst: /usr/share/doc/wspace/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/wspace/NOTICE
      - src: THIRD_PARTY_LICENSES
        dst: /usr/share/doc/wspace/THIRD_PARTY_LICENSES

# homebrew_casks replaces the deprecated `brews` section (GoReleaser v2.10+).
homebrew_casks:
  - name: wspace
    ids:
      - wspace
    binaries:
      - wspace
    repository:
      owner: kivoradigital
      name: homebrew-tap
      token: "{{ .Env.RELEASE_TOKEN }}"
    directory: Casks
    homepage: https://github.com/kivoradigital/wspace
    description: Multi-repository git worktree workspaces (CLI, MCP server and RPC engine).
    license: Apache-2.0
    commit_msg_template: "chore: update {{ .ProjectName }} to {{ .Tag }}"
    skip_upload: auto

scoops:
  - name: wspace
    ids:
      - wspace
    repository:
      owner: kivoradigital
      name: scoop-bucket
      token: "{{ .Env.RELEASE_TOKEN }}"
    homepage: https://github.com/kivoradigital/wspace
    description: Multi-repository git worktree workspaces (CLI, MCP server and RPC engine).
    license: Apache-2.0
    commit_msg_template: "chore: update {{ .ProjectName }} to {{ .Tag }}"
    skip_upload: auto

winget:
  - name: wspace
    ids:
      - wspace
    publisher: Kivora Digital S.L.
    publisher_url: https://github.com/kivoradigital
    package_identifier: KivoraDigital.wspace
    short_description: Multi-repository git worktree workspaces (CLI, MCP server and RPC engine).
    license: Apache-2.0
    license_url: https://github.com/kivoradigital/wspace/blob/main/LICENSE
    homepage: https://github.com/kivoradigital/wspace
    tags:
      - git
      - worktree
      - cli
      - mcp
    # A fork of microsoft/winget-pkgs; a pull request is opened against the
    # upstream repository once publishing is enabled.
    repository:
      owner: kivoradigital
      name: winget-pkgs
      token: "{{ .Env.RELEASE_TOKEN }}"
      branch: "{{ .ProjectName }}-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: auto

chocolateys:
  - name: wspace
    ids:
      - wspace
    title: wspace
    owners: Kivora Digital S.L.
    authors: Kivora Digital S.L.
    project_url: https://github.com/kivoradigital/wspace
    project_source_url: https://github.com/kivoradigital/wspace
    docs_url: https://github.com/kivoradigital/wspace/blob/main/README.md
    bug_tracker_url: https://github.com/kivoradigital/wspace/issues
    license_url: https://github.com/kivoradigital/wspace/blob/main/LICENSE
    require_license_acceptance: false
    copyright: 2026 Kivora Digital S.L.
    tags: "git worktree cli mcp"
    summary: Multi-repository git worktree workspaces.
    description: |
      wspace manages multi-repository workspaces built from git worktrees,
      with a CLI, an MCP server for AI agents and a JSON-lines RPC engine.
    release_notes: "https://github.com/kivoradigital/wspace/releases/tag/{{ .Tag }}"
    # GoReleaser only packs the .nupkg. release.yml pushes it in a separate,
    # non-fatal step after the attestations, so a chocolatey.org rejection
    # never breaks the rest of the release.
    skip_publish: true

# Signs the macOS binaries with a Developer ID dedicated to this CLI and
# notarizes them with Apple (quill, built into GoReleaser; works on any
# runner). The credentials exist only in the protected `release`
# environment, so dry runs and local snapshots skip this.
notarize:
  macos:
    - enabled: '{{ ne (index .Env "MACOS_SIGN_P12") "" }}'
      ids:
        - wspace
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

release:
  github:
    owner: kivoradigital
    name: wspace
  header: |
    ## Downloads

    | System | File |
    |---|---|
    | macOS, Apple Silicon (M1 and later) | `wspace_{{ .Version }}_macos_arm64.tar.gz` |
    | macOS, Intel | `wspace_{{ .Version }}_macos_amd64.tar.gz` |
    | Linux, Intel/AMD | `wspace_{{ .Version }}_linux_amd64.tar.gz`, `.deb` or `.rpm` |
    | Linux, ARM | `wspace_{{ .Version }}_linux_arm64.tar.gz`, `.deb` or `.rpm` |
    | Windows, Intel/AMD | `wspace_{{ .Version }}_windows_amd64.zip` |
    | Windows, ARM | `wspace_{{ .Version }}_windows_arm64.zip` |

    Package managers: `brew install --cask kivoradigital/tap/wspace` (macOS),
    `scoop install kivoradigital/wspace` (Windows, after
    `scoop bucket add kivoradigital https://github.com/kivoradigital/scoop-bucket`).
    See the [README](https://github.com/kivoradigital/wspace#install) for winget,
    Chocolatey, deb/rpm and install steps.

    Verify a download with `shasum -a 256 -c checksums.txt --ignore-missing`
    (macOS) or `sha256sum -c checksums.txt --ignore-missing` (Linux), and its
    build provenance with `gh attestation verify <file> -R kivoradigital/wspace`.
    The macOS binaries are signed with a Developer ID and notarized by Apple.
